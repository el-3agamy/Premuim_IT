            <img src="../../assets/icons/client_icons/logo5.png" alt="TCS" class="client-logo-item">
            <img src="../../assets/icons/client_icons/logo4.png" alt="Aecon" class="client-logo-item">

            <!-- Row 2 -->
            <img src="../../assets/icons/client_icons/Frame 4.png" alt="Wisys" class="client-logo-item">
            <img src="../../assets/icons/client_icons/Group 35517.png" alt="Cognizant" class="client-logo-item">
            <img src="../../assets/icons/client_icons/logo6.png" alt="Alargan" class="client-logo-item">

            <img src="../../assets/icons/client_icons/Frame 4.png" alt="Wisys" class="client-logo-item">
            <img src="../../assets/icons/client_icons/Group 35517.png" alt="Cognizant" class="client-logo-item">
            <img src="../../assets/icons/client_icons/logo6.png" alt="Alargan" class="client-logo-item">
            <img src="../../assets/icons/client_icons/logo5.png" alt="TCS" class="client-logo-item">
            <img src="../../assets/icons/client_icons/logo4.png" alt="Aecon" class="client-logo-item">

            <!-- Row 4 -->
            <img src="../../assets/icons/client_icons/Frame 4.png" alt="Wisys" class="client-logo-item">
            <img src="../../assets/icons/client_icons/Group 35517.png" alt="Cognizant" class="client-logo-item">
            <img src="../../assets/icons/client_icons/logo6.png" alt="Alargan" class="client-logo-item">
            <img src="../../assets/icons/client_icons/logo5.png" alt="TCS" class="client-logo-item">
            <img src="../../assets/icons/client_icons/logo4.png" alt="Aecon" class="client-logo-item">
        </section>
    </main>

    <footer class="footer-main">

        <div class="footer-social-links">
            <a href="#" class="footer-social-link twitter"><i data-lucide="twitter"></i></a>
            <a href="#" class="footer-social-link linkedin"><i data-lucide="linkedin"></i></a>
            <a href="#" class="footer-social-link facebook"><i data-lucide="facebook"></i></a>

        <div class="nav-logo footer-logo-box">
            <img src="../../assets/footer_logo.png" alt="Premium IT Logo">

                 <span  id="footer_first_span" > Premium</span>

        <div>
            <p>&copy; 2025 Premium IT. All rights reserved.</p>

        </div>

    </footer>

    <script>
        lucide.createIcons();

        // Mobile Menu Toggle
        const toggleBtn = document.querySelector('.mobile-nav-toggle');
        const navLinks = document.querySelector('.nav-links');

        toggleBtn.addEventListener('click', () => {
            navLinks.classList.toggle('mobile-active');
            const icon = toggleBtn.querySelector('i');
            if (navLinks.classList.contains('mobile-active')) {
                icon.setAttribute('data-lucide', 'x');
            } else {
                icon.setAttribute('data-lucide', 'menu');
            }
            lucide.createIcons();
        });
    </script>
